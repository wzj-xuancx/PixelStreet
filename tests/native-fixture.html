<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>PixelStreet Native Probe · 桌面穿透验证</title><style>body{margin:0;background:repeating-linear-gradient(45deg,#514866 0 40px,#615275 40px 80px);color:white;font:16px -apple-system,sans-serif}main{padding:24px}button,input{font:16px -apple-system,sans-serif;padding:12px}#under{position:fixed;left:390px;bottom:80px;width:180px}#typing{position:fixed;right:24px;bottom:54px;width:240px;background:#faf3e1;color:#242430}#result{white-space:pre-wrap}</style><main><h1>真实桌面穿透验证窗口</h1><p>这是独立原生窗口。条纹应透过小街的空白像素可见；下方按钮与输入框用于验证系统实际命中与键盘焦点。</p><pre id="result">尚未操作</pre><button id="under">底层点击计数 0</button><input id="typing" placeholder="底层输入：WASD / Tab"><button id="after" style="position:fixed;right:24px;bottom:8px">Tab 后的按钮</button></main><script>window.probeState={clicks:0,text:'',keys:[],focus:''};document.getElementById('under').onclick=()=>{window.probeState.clicks++;document.getElementById('under').textContent='底层点击计数 '+window.probeState.clicks;render()};document.getElementById('typing').oninput=e=>{window.probeState.text=e.target.value;render()};document.addEventListener('keydown',e=>{window.probeState.keys.push({key:e.key,code:e.code});render()});document.addEventListener('focusin',e=>{window.probeState.focus=e.target.id;render()});function render(){document.getElementById('result').textContent=JSON.stringify(window.probeState,null,2)}</script></html>
